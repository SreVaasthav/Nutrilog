<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NutriLog – Home</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="app" style="display:block">
  <header><h1>NutriLog</h1><button class="out" id="logout">Log out</button></header>
  <div class="row">
    <input id="food" list="foodlist" placeholder="Food (e.g. rice, banana)">
    <datalist id="foodlist"></datalist>
    <input id="grams" type="number" min="1" placeholder="Grams">
    <button class="btn" id="add">Add</button>
  </div>
  <div class="err" id="err2"></div>
  <div class="totals">
    <div class="tot"><b id="tCal">0</b>kcal</div>
    <div class="tot"><b id="tP">0</b>protein (g)</div>
    <div class="tot"><b id="tC">0</b>carbs (g)</div>
    <div class="tot"><b id="tF">0</b>fat (g)</div>
  </div>
  <table>
    <thead><tr><th>Food</th><th>Grams</th><th>kcal</th><th>P</th><th>C</th><th>F</th><th></th></tr></thead>
    <tbody id="list"></tbody>
  </table>
</div>
<script src="/Dashboard.js"></script>
</body>
</html>
